# ============================================================
# Global GitLab configuration
# ============================================================

global:

  # Community Edition
  edition: ce

  # All GitLab workloads must run on the gitlab node.
  nodeSelector:
    workload: gitlab

  # ----------------------------------------------------------
  # Public hostnames
  # ----------------------------------------------------------

  hosts:
    domain: iot.test

    # We use HTTP only for the local lab.
    https: false

    # IP used to reach Traefik from the host machine.
    externalIP: 192.168.56.110

    gitlab:
      name: gitlab.iot.test
      https: false

    registry:
      name: registry.iot.test
      https: false

    ssh: gitlab.iot.test

  # ----------------------------------------------------------
  # Kubernetes Ingress
  #
  # K3s already provides Traefik.
  # ----------------------------------------------------------

  ingress:
    enabled: true

    provider: traefik
    class: traefik

    configureCertmanager: false

    tls:
      enabled: false

  # GitLab 19 uses Gateway API by default.
  # We do NOT want GitLab to install Envoy Gateway because
  # K3s already provides Traefik.
  gatewayApi:
    enabled: false
    installEnvoy: false
    configureEnvoy: false
    configureCertmanager: false

  # ----------------------------------------------------------
  # PostgreSQL
  # ----------------------------------------------------------

  psql:
    host: gitlab-postgresql-rw.gitlab.svc.cluster.local
    port: 5432

    database: gitlabhq_production
    username: gitlab

    password:
      useSecret: true
      secret: gitlab-postgresql-auth
      key: password

  # ----------------------------------------------------------
  # Valkey
  #
  # GitLab still calls this section "redis" because Valkey
  # is protocol-compatible with Redis.
  # ----------------------------------------------------------

  redis:
    host: gitlab-valkey.gitlab.svc.cluster.local
    port: 6379

    auth:
      enabled: true
      secret: gitlab-valkey-auth
      key: redis-password

  # ----------------------------------------------------------
  # GitLab Shell / SSH
  # ----------------------------------------------------------

  shell:
    port: 30022

  # ----------------------------------------------------------
  # GitLab Container Registry
  # ----------------------------------------------------------

  registry:
    enabled: true
    bucket: registry

  # ----------------------------------------------------------
  # GitLab Agent Server
  #
  # Not required for our ArgoCD GitOps architecture.
  # ----------------------------------------------------------

  kas:
    enabled: false

  # ----------------------------------------------------------
  # Garage / S3 object storage
  # ----------------------------------------------------------

  appConfig:

    object_store:
      enabled: true

      # The browser must not receive internal Kubernetes
      # URLs such as garage.gitlab.svc.cluster.local.
      proxy_download: true

      connection:
        secret: gitlab-object-storage
        key: config

    # CI artifacts
    artifacts:
      bucket: gitlab-artifacts

    # Git LFS
    lfs:
      bucket: git-lfs

    # User uploads / attachments
    uploads:
      bucket: gitlab-uploads

    # Package registry
    packages:
      bucket: gitlab-packages

    # Merge Request diffs
    externalDiffs:
      enabled: true
      bucket: gitlab-mr-diffs

    # Terraform states
    terraformState:
      enabled: true
      bucket: gitlab-terraform-state

    # CI Secure Files
    ciSecureFiles:
      enabled: true
      bucket: gitlab-ci-secure-files

    # Dependency Proxy
    dependencyProxy:
      enabled: true
      bucket: gitlab-dependency-proxy

    # GitLab Agent plan content
    agentPlanContent:
      enabled: true
      bucket: gitlab-agent-plan-content

    # CI Catalog bundles
    ciCatalogBundles:
      enabled: true
      bucket: gitlab-ci-catalog-bundles

    # GitLab backups
    backups:
      bucket: gitlab-backups
      tmpBucket: tmp

      objectStorage:
        backend: s3


# ============================================================
# GitLab application components
# ============================================================

gitlab:

  # ----------------------------------------------------------
  # Web interface / REST API / GraphQL
  # ----------------------------------------------------------

  webservice:
    minReplicas: 1
    maxReplicas: 1

    ingress:
      tls:
        enabled: false

  # ----------------------------------------------------------
  # Background jobs
  # ----------------------------------------------------------

  sidekiq:
    minReplicas: 1
    maxReplicas: 1

  # ----------------------------------------------------------
  # Git repositories
  #
  # Gitaly stores the REAL Git repositories.
  # Garage does not store Git repositories.
  # ----------------------------------------------------------

  gitaly:
    persistence:
      enabled: true
      storageClass: local-path
      accessMode: ReadWriteOnce
      size: 10Gi

  # ----------------------------------------------------------
  # Git over SSH
  #
  # We expose SSH directly with a NodePort.
  # ----------------------------------------------------------

  gitlab-shell:

    replicaCount: 1

    service:
      type: NodePort
      nodePort: 30022

  # ----------------------------------------------------------
  # Administrative toolbox / backup utilities
  # ----------------------------------------------------------

  toolbox:

    replicas: 1

    backups:
      objectStorage:
        backend: s3

        config:
          secret: gitlab-object-storage-s3cmd
          key: config


# ============================================================
# GitLab Container Registry
# ============================================================

registry:

  enabled: true

  hpa:
    minReplicas: 1
    maxReplicas: 1

  ingress:
    tls:
      enabled: false

  storage:
    secret: gitlab-registry-storage
    key: config

    # Garage is only reachable inside Kubernetes.
    redirect:
      disable: true


# ============================================================
# Networking components
# ============================================================

# K3s already has Traefik.
traefik:
  install: false

# We do not install GitLab's NGINX ingress controller.
nginx-ingress:
  enabled: false


# ============================================================
# TLS / cert-manager
# ============================================================

# Local HTTP lab, no Let's Encrypt.
installCertmanager: false


# ============================================================
# Optional components disabled to save resources
# ============================================================

prometheus:
  install: false

gitlab-runner:
  install: false