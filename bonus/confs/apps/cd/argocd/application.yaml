apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: dev-app
  namespace: argocd

spec:

  project: default

  source:

    repoURL: http://gitlab-webservice-default.gitlab.svc.cluster.local:8181/bberkrou/bberkrou-iot.git

    targetRevision: main

    path: bonus/confs/apps/cd/dev/app

  destination:

    server: https://kubernetes.default.svc

    namespace: dev

  syncPolicy:

    automated:

      prune: true

      selfHeal: true