apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argocd

resources:
  - namespace.yaml
  - ingress.yaml
  - https://raw.githubusercontent.com/argoproj/argo-cd/v3.5.3/manifests/install.yaml

patches:

  # ==========================================================
  # Run all Argo CD Deployments on the cd node
  # ==========================================================

  - target:
      kind: Deployment

    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          workload: cd


  # ==========================================================
  # Run Argo CD StatefulSets on the cd node
  # ==========================================================

  - target:
      kind: StatefulSet

    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          workload: cd


  # ==========================================================
  # Argo CD runs behind Traefik.
  # Disable Argo CD internal HTTPS redirect.
  # ==========================================================

  - target:
      kind: ConfigMap
      name: argocd-cmd-params-cm

    patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: argocd-cmd-params-cm
      data:
        server.insecure: "true"