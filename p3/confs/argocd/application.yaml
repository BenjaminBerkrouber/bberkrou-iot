apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev-app
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/BenjaminBerkrouber/bberkrou-iot.git
    targetRevision: main
    path: p3/confs/app

  destination:
    server: https://kubernetes.default.svc
    namespace: dev

  syncPolicy:
    automated:
      prune: true
      selfHeal: true